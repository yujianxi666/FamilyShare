plugins {
    id 'com.android.application'
}

// 从 gradle.properties 读取配置，也可以在命令行覆盖：-PAMAP_KEY=xxx -PSERVER_URL=xxx -PAPI_TOKEN=xxx
def amapKey = project.findProperty('AMAP_KEY') ?: 'YOUR_AMAP_KEY_HERE'
def serverUrl = project.findProperty('SERVER_URL') ?: 'http://192.168.1.100:3000'
def apiToken = project.findProperty('API_TOKEN') ?: 'YOUR_API_TOKEN'

android {
    namespace 'com.family.share'
    compileSdk 34

    defaultConfig {
        applicationId "com.family.share"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // 高德 Key 同时注入 AndroidManifest 与 BuildConfig
        manifestPlaceholders = [AMAP_KEY: amapKey]
        buildConfigField "String", "AMAP_KEY", "\"${amapKey}\""
        buildConfigField "String", "SERVER_URL", "\"${serverUrl}\""
        buildConfigField "String", "API_TOKEN", "\"${apiToken}\""
    }

    buildTypes {
        release {
            // 开启混淆 + 资源压缩，减小安装包体积（原为 false）
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // ABI 保险：当前所有依赖都没有原生库（高德轻量版地图为 WebView 实现、ZXing/OkHttp 均为纯 Java），
            // 打包结果里已无 lib/*.so；此处保留过滤，若将来引入原生库则只打包 ARM 真机 ABI（去掉仅模拟器用的 x86/x86_64）。
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }

    compileOptions {
        // JDK 21 已弃用 target 8，用 11 消除警告（D8 会自动降级字节码，兼容 minSdk 23）
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }
}

// 显示已过时 API 的使用位置（便于清理）
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-Xlint:deprecation"]
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.13.1'

    // 网络
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // 高德「轻量版地图SDK」V1.3.2（合包：地图 1.3.2 + 搜索 9.7.4 + 定位 6.4.9）
    // 该 SDK 不在 Maven 仓库，需手动下载 https://a.amap.com/lbs/static/amap_3dmap_lite/Lite3DMap.zip
    // 并把其中的 jar 放到 app/libs/。它基于 WebView 渲染，**不含原生 .so**，APK 体积远小于 3dmap。
    // 包名与 3D 地图 SDK 一致（com.amap.api.maps / com.amap.api.location），上层代码基本无需改动。
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // 二维码：家庭码生成（core）+ 扫码（zxing-android-embedded，内含相机扫码界面）
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
