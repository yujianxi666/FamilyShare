# JVM 参数
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# ============ 项目配置（修改这里即可，无需改动代码） ============
# 高德开放平台申请的 Key（lbs.amap.com 控制台 -> 应用管理 -> 创建应用，服务平台选 Android）
# 注意：Key 绑定的包名/SHA1 必须与本工程 applicationId 和签名一致
AMAP_KEY=YOUR_AMAP_KEY

# 后端服务器地址（HTTPS/WSS 经 Nginx 443 反代到服务器 3000；WS 由 SERVER_URL 自动推导为 wss://...）
SERVER_URL=https://your-server.example.com

# 访问口令：与服务器 application.properties 的 app.api-token 一致；/api/**、/ws、/icons/** 请求需携带
API_TOKEN=YOUR_API_TOKEN
