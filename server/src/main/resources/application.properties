server.port=3000

# 强制所有响应使用 UTF-8（避免中文乱码，官网/API 均生效）
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# 访问口令：/api/**、/ws、/icons/** 需在请求头 X-Api-Token 或查询参数 token 携带此值；客户端 gradle.properties 的 API_TOKEN 需一致
app.api-token=YOUR_API_TOKEN

# Bug 管理页 /bugadmin/<token> 的路径口令（改成你自己的值，访问 /bugadmin/<token> 需要它）
app.bug-admin-token=YOUR_BUG_ADMIN_TOKEN

# 部署在 Nginx 反向代理(HTTPS 443)之后：让后端读取 X-Forwarded-Proto，使 /api/update/latest 生成的 APK 下载地址为 https
server.forward-headers-strategy=framework

# Redis 数据存储（按实体分 key；password 为你的 AUTH，无密码可留空）
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=YOUR_SECRET
spring.data.redis.timeout=5000
